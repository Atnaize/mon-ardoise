services:
  db:
    image: postgres:16-alpine
    container_name: mon-ardoise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ardoise
      POSTGRES_PASSWORD: ardoise
      POSTGRES_DB: mon_ardoise
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardoise -d mon_ardoise"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
